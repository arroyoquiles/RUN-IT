<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Gym + BMT · 4 semanas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--card:#fffdf8;--ink:#1d2433;--mute:#6b7385;--line:#e6e0d3;--gym:#e0592a;--gym2:#fde6dc;--run:#1f7a8c;--run2:#d9eef2;--ok:#2e9e5b;--chip:#efe9dc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#eef1f7;--mute:#98a1b5;--line:#252e44;--gym:#ff7a45;--gym2:#3a2219;--run:#4cc3d9;--run2:#14323a;--ok:#4ade80;--chip:#222b40}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#eef1f7;--mute:#98a1b5;--line:#252e44;--gym:#ff7a45;--gym2:#3a2219;--run:#4cc3d9;--run2:#14323a;--ok:#4ade80;--chip:#222b40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;line-height:1.15;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.total{margin:16px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gym),var(--run));border-radius:99px;transition:width .4s}
.trow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:600}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.wk{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 4px;cursor:pointer;font:inherit;text-align:center}
.wk b{display:block;font-size:15px}.wk span{font-size:11px;color:var(--mute)}
.wk.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.wk.on span{color:var(--bg);opacity:.75}
.focus{font-size:13px;color:var(--mute);margin:0 2px 12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.dy{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 0 10px;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
.dy small{display:block;font-weight:500;color:var(--mute);font-size:10px;margin-top:2px}
.dy.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.dy.done{background:var(--ok);color:#fff;border-color:var(--ok)}.dy.done small{color:#fff;opacity:.85}
.dy i{position:absolute;left:8px;right:8px;bottom:3px;height:3px;border-radius:9px;background:var(--chip);overflow:hidden}
.dy i b{display:block;height:100%;background:var(--ok)}
.dy.done i{display:none}
.dayhead h2{margin:0;font-size:20px;letter-spacing:-.01em}
.dayhead p{margin:2px 0 12px;color:var(--mute);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);padding:5px;border-radius:16px;margin-bottom:14px}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-weight:700;font-size:14px;padding:11px 6px;border-radius:12px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg small{display:block;font-weight:500;font-size:11px;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px 14px;border-top:4px solid var(--c)}
.card.g{--c:var(--gym)}.card.r{--c:var(--run)}
.ex{padding:12px 0;border-bottom:1px solid var(--line)}.ex:last-of-type{border-bottom:0}
.ex.ok .nm{text-decoration:line-through;opacity:.55}
.nm{font-weight:700;font-size:15px}.rp{font-size:13px;color:var(--mute);margin:2px 0 8px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{min-width:64px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:9px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.card.g .set.on{background:var(--gym);border-color:var(--gym);color:#fff}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.step:last-of-type{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:15px;margin-top:1px}
.step.on .box{background:var(--run);border-color:var(--run)}
.step.on .st{text-decoration:line-through;opacity:.55}
.st{font-weight:700;font-size:15px}.sd{font-size:13px;color:var(--mute);margin-top:2px}
.tip{margin-top:10px;background:var(--gym2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.card.r .tip{background:var(--run2)}
.rest{text-align:center;padding:36px 20px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.rest div{font-size:42px}.rest p{color:var(--mute);margin:6px 0 0;font-size:14px}
textarea{width:100%;margin-top:14px;min-height:70px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font:inherit;font-size:14px;resize:vertical}
.foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:12px}
.foot button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
.sets{display:block}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.srow .set{flex:none;min-width:92px;text-align:left}
.in{width:70px;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 8px;font:inherit;font-size:14px;font-weight:600;text-align:center}
.in:focus{outline:2px solid var(--gym);outline-offset:1px;border-color:var(--gym)}
.x{color:var(--mute);font-weight:700}
.hint{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.45}
.hint b{color:var(--gym)}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>Home Gym + BMT</h1><div class="sub">Fuerza por la mañana · Running por la tarde · Bloque de 4 semanas</div></div>
<button class="theme" id="theme" aria-label="Cambiar tema">🌓</button>
</header>
<div class="total"><div class="trow"><span>Progreso total</span><span id="tp">0%</span></div><div class="bar"><i id="tb"></i></div></div>
<div class="weeks" id="weeks"></div>
<p class="focus" id="focus"></p>
<div class="days" id="days"></div>
<div id="day"></div>
<div class="foot"><span>Anota pesos, dolor de piernas (0–10) y sueño en las notas.</span><button id="reset">Reiniciar semana</button></div>
</div>
<script>
var DN=[["Lun","Lunes"],["Mar","Martes"],["Mié","Miércoles"],["Jue","Jueves"],["Vie","Viernes"],["Sáb","Sábado"],["Dom","Domingo"]];
var GYM=[
{t:"Push",d:"Pecho, tríceps, hombros y push-ups",ex:[["Dumbbell bench press",3,"8–12"],["Incline dumbbell press",2,"8–12"],["Dumbbell lateral raise",2,"12–20"],["Overhead triceps extension",2,"10–15"],["Push-ups",2,"Deja 2–3 repeticiones en reserva"]],tip:"Para caber en 40 min: alterna elevaciones laterales y extensiones de tríceps; no hagas superserie de los dos presses."},
{t:"Pull",d:"Espalda, bíceps y hombro posterior",ex:[["One-arm dumbbell row",3,"8–12 por lado"],["Chest-supported dumbbell row",2,"10–15"],["Rear-delt fly",2,"12–20"],["Dumbbell curl",2,"8–12"],["Hammer curl",2,"10–15"]],tip:"Alterna rear-delt fly con curl; deja hammer curl al final."},
{t:"Core + calistenia",d:"Breve y submáximo para no afectar el tempo",ex:[["Forearm plank",2,"20–45 s"],["Dead bug",2,"8–12 por lado"],["Side plank",2,"20–35 s por lado"],["Sit-ups",2,"10–15 controlados"]],tip:"Si estás muy fatigado, elimina los sit-ups esta semana."},
{t:"Upper ligero",d:"Accesorios, 3–4 repeticiones en reserva",ex:[["Incline dumbbell press ligero",2,"10–12"],["One-arm dumbbell row ligero",2,"10–12 por lado"],["Lateral raises",2,"12–20"],["Dumbbell curl",2,"10–15"],["Overhead triceps extension",2,"10–15"]],tip:"Si sigues adolorido, haz solo 2–3 ejercicios fáciles."},
{t:"Piernas",d:"Volumen moderado",ex:[["Goblet squat",2,"8–12"],["Dumbbell Romanian deadlift",2,"8–12"],["Reverse lunge",2,"8 por pierna"],["Dumbbell hip thrust",2,"10–15"],["Calf raises",2,"12–20"]],tip:"Descansa 2–3 min en squat, RDL y lunges. No añadas Bulgarian split squats ni más ejercicios de piernas."}
];
var W=[
{n:"Adaptación",f:"Semana 1 · Adaptación. No añadas ejercicios extra; elige cargas con técnica limpia.",i:"5 × 400 m",tm:"12 min",e:["20–25 min easy","20 min recovery","15–20 min easy"]},
{n:"Adaptación",f:"Semana 2 · Adaptación. Añade repeticiones poco a poco; sin ejercicios extra.",i:"5 × 400 m",tm:"14 min",e:["22–28 min easy","20–22 min recovery","15–20 min easy"]},
{n:"Carga",f:"Semana 3 · La más exigente. Si no recuperas bien, repite la semana 2.",i:"6 × 400 m (solo si recuperas bien)",tm:"15–16 min",e:["25–30 min easy","20–25 min recovery","15–20 min easy"]},
{n:"Descarga",f:"Semana 4 · Descarga. Intervalos fáciles y menos tiempo corriendo.",i:"4 × 400 m fácil",tm:"10–12 min",e:["20–25 min easy","20 min recovery","15 min o caminar"]}
];
function run(w,d){
 var c=W[w],wu=["Calentamiento","8–10 min suaves + movilidad dinámica"],cd=["Enfriamiento","5 min suaves"];
 if(d==0)return{t:"Velocidad / intervalos",s:[wu,["Intervalos: "+c.i,"Ritmo ≈ 2:12–2:18 por 400 m (8:50–9:15 min/milla). Recupera ~200 m caminando/trotando entre repeticiones. Si la técnica se deteriora, baja el ritmo."],cd],tip:"Si las agujetas del lunes cambian tu zancada: 20 min fáciles o descanso."};
 if(d==2)return{t:"Tempo controlado",s:[wu,["Tempo: "+c.tm,"Esfuerzo 6–7/10, firme pero controlado. No es una prueba máxima."],cd],tip:"Con calor y humedad, corre por esfuerzo, no por pace."};
 var m=d==1?c.e[0]:d==3?c.e[1]:c.e[2],lbl=d==3?"Recovery":d==4?"Easy corto":"Easy";
 return{t:lbl,s:[["Carrera: "+m,"Debes poder hablar en frases completas."+(d==4?" Si las piernas alteran tu zancada, cambia por caminata o descanso.":"")]],tip:d==4?"Viernes = día de piernas. Cuida la zancada.":"Con calor y humedad, corre por esfuerzo, no por pace."};
}
var KEY="hgbmt-v1",S={c:{},n:{},l:{}},st={w:0,d:0,tab:"g"};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);S.c=S.c||{};S.n=S.n||{};S.l=S.l||{}}catch(e){}
try{var tz=localStorage.getItem(KEY+"-t");if(tz)document.documentElement.setAttribute("data-theme",tz)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function units(w,d){
 if(d>4)return[];var u=[],g=GYM[d];
 g.ex.forEach(function(x,i){for(var s=0;s<x[1];s++)u.push(w+"-"+d+"-g"+i+"-"+s)});
 run(w,d).s.forEach(function(_,i){u.push(w+"-"+d+"-r"+i)});return u;
}
function prog(keys){if(!keys.length)return 0;var n=0;keys.forEach(function(k){if(S.c[k])n++});return n/keys.length}
function render(){
 var all=[];for(var w=0;w<4;w++)for(var d=0;d<5;d++)all=all.concat(units(w,d));
 var p=Math.round(prog(all)*100);document.getElementById("tp").textContent=p+"%";document.getElementById("tb").style.width=p+"%";
 document.getElementById("weeks").innerHTML=W.map(function(c,w){var wk=[];for(var d=0;d<5;d++)wk=wk.concat(units(w,d));
  return '<button class="wk'+(w==st.w?' on':'')+'" data-w="'+w+'"><b>Sem '+(w+1)+'</b><span>'+Math.round(prog(wk)*100)+'% · '+c.n+'</span></button>'}).join("");
 document.getElementById("focus").textContent=W[st.w].f;
 document.getElementById("days").innerHTML=DN.map(function(n,d){var u=units(st.w,d),pr=prog(u);
  return '<button class="dy'+(d==st.d?' on':'')+(u.length&&pr==1?' done':'')+'" data-d="'+d+'">'+n[0]+'<small>'+(d>4?'libre':u.length&&pr==1?'✓':Math.round(pr*100)+'%')+'</small><i><b style="width:'+pr*100+'%"></b></i></button>'}).join("");
 var el=document.getElementById("day"),d=st.d,w=st.w,key=w+"-"+d;
 if(d>4){el.innerHTML='<div class="dayhead"><h2>'+DN[d][1]+'</h2></div><div class="rest"><div>😴</div><b>Descanso</b><p>Sin entrenamiento programado ni running. Prioriza dormir bien.</p></div>';return}
 var g=GYM[d],r=run(w,d),h='<div class="dayhead"><h2>'+DN[d][1]+'</h2><p>'+g.t+' + '+r.t+'</p></div>';
 var gp=Math.round(prog(units(w,d).filter(function(k){return k.indexOf("-g")>0})) *100),rp=Math.round(prog(units(w,d).filter(function(k){return k.indexOf("-r")>0}))*100);
 h+='<div class="seg"><button data-t="g" class="'+(st.tab=="g"?'on':'')+'">💪 Gym<small>4:40–5:20 a. m. · '+gp+'%</small></button><button data-t="r" class="'+(st.tab=="r"?'on':'')+'">🏃 Run<small>Tarde · '+rp+'%</small></button></div>';
 if(st.tab=="g"){
  h+='<div class="card g">'+g.ex.map(function(x,i){var ch="",ok=true;for(var s=0;s<x[1];s++){var k=key+"-g"+i+"-"+s,on=S.c[k];if(!on)ok=false;var lg=S.l[k]||{};ch+='<div class="srow"><button class="set'+(on?' on':'')+'" data-k="'+k+'">Serie '+(s+1)+(on?' ✓':'')+'</button><input class="in" inputmode="decimal" placeholder="lb" aria-label="Peso en libras" data-l="'+k+'" data-f="w" value="'+(lg.w||'')+'"><span class="x">×</span><input class="in" inputmode="numeric" placeholder="reps" aria-label="Repeticiones" data-l="'+k+'" data-f="r" value="'+(lg.r||'')+'"></div>'}
   return '<div class="ex'+(ok?' ok':'')+'"><div class="nm">'+x[0]+'</div><div class="rp">'+x[1]+' × '+x[2]+'</div><div class="sets">'+ch+'</div><div class="hint" id="h-'+key+'-'+i+'">'+hint(w,d,i)+'</div></div>'}).join("")+'<div class="tip">'+g.tip+'</div></div>';
 }else{
  h+='<div class="card r">'+r.s.map(function(x,i){var k=key+"-r"+i,on=S.c[k];return '<button class="step'+(on?' on':'')+'" data-k="'+k+'"><span class="box">'+(on?'✓':'')+'</span><span><div class="st">'+x[0]+'</div><div class="sd">'+x[1]+'</div></span></button>'}).join("")+'<div class="tip">'+r.tip+'</div></div>';
 }
 h+='<textarea id="note" placeholder="Notas del día: pesos, esfuerzo, dolor de piernas 0–10, sueño…">'+(S.n[key]||"").replace(/</g,"&lt;")+'</textarea>';
 el.innerHTML=h;
 document.getElementById("note").oninput=function(e){S.n[key]=e.target.value;save()};
}
function hint(w,d,i){var x=GYM[d].ex[i],h="",m=/(\d+)\s*[–-]\s*(\d+)/.exec(x[2]),s,l;
 for(var p=w-1;p>=0;p--){var a=[];for(s=0;s<x[1];s++){l=S.l[p+"-"+d+"-g"+i+"-"+s];if(l&&(l.w||l.r))a.push((l.w||"–")+"×"+(l.r||"–"))}if(a.length){h="Sem "+(p+1)+": "+a.join(" · ");break}}
 if(m){var ok=true,wt=true;for(s=0;s<x[1];s++){l=S.l[w+"-"+d+"-g"+i+"-"+s];if(!l||!(+l.r>=+m[2]))ok=false;if(!l||!(+l.w>0))wt=false}
  if(ok&&wt)h+=(h?"<br>":"")+"<b>🔥 Máximo del rango en todas las series: sube al siguiente peso y vuelve a "+m[1]+" reps.</b>"}
 return h}
document.addEventListener("input",function(e){var t=e.target;if(!t.dataset||!t.dataset.l)return;var k=t.dataset.l;S.l[k]=S.l[k]||{};S.l[k][t.dataset.f]=t.value;save();var m=/^(\d+)-(\d+)-g(\d+)-\d+$/.exec(k);if(!m)return;var h=document.getElementById("h-"+m[1]+"-"+m[2]+"-"+m[3]);if(h)h.innerHTML=hint(+m[1],+m[2],+m[3])});
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.k){S.c[b.dataset.k]=!S.c[b.dataset.k];save();render()}
 else if(b.dataset.w){st.w=+b.dataset.w;render()}
 else if(b.dataset.d){st.d=+b.dataset.d;render()}
 else if(b.dataset.t){st.tab=b.dataset.t;render()}
 else if(b.id=="theme"){var cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),nx=cur=="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem(KEY+"-t",nx)}catch(x){};}
 else if(b.id=="reset"){if(confirm("¿Reiniciar los checks de la semana "+(st.w+1)+"?")){Object.keys(S.c).forEach(function(k){if(k.indexOf(st.w+"-")==0)delete S.c[k]});Object.keys(S.l).forEach(function(k){if(k.indexOf(st.w+"-")==0)delete S.l[k]});save();render()}}
});
var t=new Date().getDay();st.d=t==0?6:t-1;if(st.d>4)st.d=0;
render();
</script>
</body>
</html>
